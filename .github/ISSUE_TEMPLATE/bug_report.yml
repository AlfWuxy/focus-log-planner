name: Bug report
description: Report a reproducible problem in Focus Log.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Use fictional data and remove private URLs, IDs, tokens, screenshots, and logs before submitting.
  - type: dropdown
    id: mode
    attributes:
      label: Data mode
      options:
        - Demo
        - Local read-only Notion
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Chrome 140, Node 22
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sanitized context
      description: Add a minimal screenshot or log only after removing personal content and credentials.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all real journal content, private URLs, IDs, and tokens.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
