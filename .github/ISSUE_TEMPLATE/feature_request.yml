name: Feature request
description: Suggest a focused improvement to Focus Log.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What planning or reflection problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful interaction.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Demo planning
        - Weekly reflection
        - Accessibility
        - Responsive design
        - Read-only Notion adapter
        - Developer experience
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The idea keeps demo mode useful without an account.
          required: true
        - label: The idea does not require publishing personal data or credentials.
          required: true
